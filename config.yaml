downloads_path: D:/Downloads/ # your path to Downloads folder
wvd_device_path: D:/Downloads/Eurovine/wvd/device.wvd # your path to *.wvd file
prd_device_path: D:/Downloads/Eurovine/prd/device.prd # your path to *.prd file
cookies_path: D:/Downloads/Eurovine/cookies/cookies.txt # your path to cookies file
update_checks: true
download:
  auto_confirm: false
credentials:
  npo: username:password
  tf1: username:password
  m6: username:password
proxy:
  enabled: true
  provider_order:
  - surfsharkvpn
  - nordvpn
  services:
    all4: false
    ard: true
    bbc: false
    drtv: true
    frtv: true
    itvx: false
    m6: true
    mse: true
    msi: true
    my5: false
    npo: true
    nrk: true
    rai: true
    rte: true
    rtve: true
    ruv: true
    stv: false
    svt: true
    tf1: true
    tv4: true
    u: true
    vm: true
    zdf: true
